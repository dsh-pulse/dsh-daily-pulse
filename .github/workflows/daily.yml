name: dsh-daily-pulse

# M1 三时点定时调度：每天 北京 06:00 / 14:00 / 22:00（= UTC 22:00 / 06:00 / 14:00）
# 每次运行：采集 → 渲染单期日报 → 渲染档案馆首页 → commit 快照 → 部署 GitHub Pages
on:
  schedule:
    - cron: '0 22 * * *'   # 北京 06:00
    - cron: '0 6 * * *'    # 北京 14:00
    - cron: '0 14 * * *'   # 北京 22:00
  workflow_dispatch: {}    # 支持手动触发（点 Actions → Run workflow）

permissions:
  contents: write          # commit 快照与日报
  pages: write             # GitHub Pages 部署
  id-token: write

concurrency:
  group: dsh-daily-pulse
  cancel-in-progress: true # 上一轮未跑完则取消，避免快照乱序

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 采集快照（GitHub Search API + npm）
        run: node collect.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 渲染单期日报
        run: node render.mjs

      - name: 渲染档案馆首页
        run: node render-index.mjs

      - name: Commit 快照与日报
        run: |
          git config user.name "dsh-daily-pulse[bot]"
          git config user.email "dsh-daily-pulse[bot]@users.noreply.github.com"
          git add store reports
          if git diff --cached --quiet; then
            echo "无数据变更，跳过 commit"
          else
            git commit -m "pulse: $(date -u +'%Y-%m-%dT%H:%MZ') snapshot"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物（reports/）
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
